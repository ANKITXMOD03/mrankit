<!DOCTYPE html>

<head>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #1c1c1e;
            --text-main: #ffffff;
            --text-sec: #8e8e93;
            --accent: #007aff;
            --glass: rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        header {
            max-width: 800px;
            margin: 40px auto 30px;
            padding: 0 10px;
        }

        header h1 {
            font-size: 34px;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(to right, #fff, #8e8e93);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Premium Card Design */
        .app-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 15px;
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
            overflow: hidden;
        }

        .app-icon {
            width: 70px;
            height: 70px;
            border-radius: 16px;
            object-fit: cover;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .app-info {
            flex-grow: 1;
        }

        .app-name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 2px;
            display: block;
        }

        .app-category {
            font-size: 12px;
            color: var(--text-sec);
            display: block;
        }

        .app-pw {
            font-size: 10px;
            color: #ff453a;
            margin-top: 4px;
            font-weight: bold;
        }

        /* Action Section */
        .action-area {
            min-width: 90px;
            text-align: right;
        }

        .download-btn {
            background-color: var(--glass);
            color: var(--accent);
            padding: 6px 20px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 700;
            font-size: 13px;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
        }

        .download-btn.loading {
            background: #3a3a3c;
            color: #fff;
            font-size: 11px;
        }

        /* Progress Bar (Fake Installation) */
        .progress-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: transparent;
            display: none;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent);
            transition: width 0.1s linear;
        }

        @media (max-width: 480px) {
            .app-icon { width: 60px; height: 60px; }
            .app-name { font-size: 15px; }
        }
    </style>
</head>
<body>

    <script>
        function startProcess(btn, url, appId) {
            let card = document.getElementById(appId);
            let pContainer = card.querySelector('.progress-container');
            let pBar = card.querySelector('.progress-bar');
            let timeLeft = 5;

            // Step 1: Timer on Button
            btn.disabled = true;
            btn.classList.add('loading');
            
            let timer = setInterval(function() {
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    btn.innerText = "INSTALLING...";
                    startLoading();
                } else {
                    btn.innerText = "WAIT " + timeLeft + "s";
                }
                timeLeft -= 1;
            }, 1000);

            // Step 2: Fake Installation Progress Bar
            function startLoading() {
                pContainer.style.display = "block";
                let width = 0;
                let loading = setInterval(function() {
                    if (width >= 100) {
                        clearInterval(loading);
                        btn.innerText = "OPEN";
                        // Step 3: Redirect
                        setTimeout(() => {
                            window.location.href = url;
                        }, 500);
                    } else {
                        width += 2; // Speed of installation
                        pBar.style.width = width + "%";
                    }
                }, 50); // Fast install animation
            }
        }
    </script>
